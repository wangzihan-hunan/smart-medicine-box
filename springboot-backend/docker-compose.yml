version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicine-box-postgres
    environment:
      POSTGRES_DB: medicine_box
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wzh@10086}
    ports:
      - "9456:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/backup:/backup
    networks:
      - medicine-box-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d medicine_box"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: medicine-box-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medicine-box-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicine-box-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/medicine_box
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-wzh@10086}
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_QWEN_ENABLED: ${AI_QWEN_ENABLED:-false}
      AI_QWEN_API_KEY: ${AI_QWEN_API_KEY}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicine-box-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  medicine-box-network:
    driver: bridge
