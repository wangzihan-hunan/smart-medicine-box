server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # Spring Boot 应用日志
  - job_name: medicine-box-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: medicine-box
          app: medicine-box
          __path__: /var/log/medicine-box/*.log
    
    pipeline_stages:
      # 解析 JSON 格式日志（logstash encoder）
      - json:
          expressions:
            level: level
            logger: logger_name
            thread: thread_name
            app_name: app_name
            environment: environment
            message: message
      
      # 提取日志级别
      - labels:
          level:
          logger:
          app_name:
          environment:
      
      # 输出到 Loki
      - output:
          source: message
