# Prometheus 全局配置
global:
  scrape_interval: 15s          # 抓取间隔
  evaluation_interval: 15s      # 规则评估间隔
  external_labels:
    monitor: 'medicine-box-monitor'
    environment: 'production'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# 告警规则文件
rule_files:
  - "alert_rules.yml"

# 抓取配置
scrape_configs:
  # Spring Boot 应用指标
  - job_name: 'medicine-box-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'medicine-box'
          service: 'backend'

  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana 自动配置（可选）
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Node Exporter（如果部署）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL Exporter（如果部署）
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter（如果部署）
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
